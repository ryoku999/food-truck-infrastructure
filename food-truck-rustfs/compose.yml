services:
  rustfs:
    image: rustfs/rustfs:latest
    container_name: willariq-rustfs-server
    restart: unless-stopped

    security_opt:
      - no-new-privileges:true

    ports:
      - "127.0.0.1:${RUSTFS_PORT:-9000}:9000"
      - "127.0.0.1:${RUSTFS_CONSOLE_PORT:-9001}:9001"

    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:?required}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:?required}
      RUSTFS_REGION: ${RUSTFS_REGION:-us-east-1}
      RUSTFS_ADDRESS: "0.0.0.0:9000"
      RUSTFS_CONSOLE_ADDRESS: "0.0.0.0:9001"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_OBS_LOGGER_LEVEL: "info"

    volumes:
      - rustfs_data:/data

    command: ["/data"]

    healthcheck:
      test:
        - CMD
        - curl
        - -fsS
        - http://127.0.0.1:9000/health
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  rustfs_data:
